name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Echoform.app, HFS+ DMG, and app zip
        run: |
          chmod +x Scripts/make_dmg.sh
          ./Scripts/make_dmg.sh
          test -f dist/Echoform.dmg
          test -f dist/Echoform.app.zip
          file dist/Echoform.dmg dist/Echoform.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: echoform-macos
          path: |
            dist/Echoform.dmg
            dist/Echoform-0.4.1.dmg
            dist/Echoform.app.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.4.1' }}
          name: Echoform 0.4.1
          files: |
            dist/Echoform.dmg
            dist/Echoform-0.4.1.dmg
            dist/Echoform.app.zip
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            **Echoform.dmg** — HFS+ UDZO, mounts in Finder.

            1. Download **Echoform.dmg**
            2. Double-click
            3. Drag **Echoform.app** to Applications
            4. Right-click the app → Open (Gatekeeper)

            Fallback: **Echoform.app.zip** — unzip, then right-click → Open.

            Apple silicon. Ad-hoc signed. Not notarized.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
