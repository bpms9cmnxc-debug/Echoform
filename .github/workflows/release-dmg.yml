name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Echoform.app and UDZO
        run: |
          chmod +x Scripts/make_dmg.sh
          ./Scripts/make_dmg.sh
          test -f dist/Echoform-0.4.0.dmg
          file dist/Echoform-0.4.0.dmg
          hdiutil imageinfo dist/Echoform-0.4.0.dmg | grep -E 'Format|Class Name|checksum'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: echoform-dmg
          path: dist/Echoform-0.4.0.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.4.0' }}
          name: Echoform 0.4.0
          files: dist/Echoform-0.4.0.dmg
          fail_on_unmatched_files: true
          body: |
            macOS installer: **Echoform-0.4.0.dmg**

            1. Double-click the DMG
            2. Drag **Echoform.app** onto Applications
            3. Open Echoform (right-click → Open if Gatekeeper asks)

            Apple silicon. Ad-hoc signed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
